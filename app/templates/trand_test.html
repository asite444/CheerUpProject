<!DOCTYPE html>
<html>
<head>
    <title>Google Trends Search</title>
</head>
<body>
    <h1>Google Trends 키워드 검색</h1>

    <!-- 키워드 입력 폼 -->
    <form action="/process/" method="post" target="resultFrame">
        <label for="keywords">키워드 입력 (쉼표로 구분):</label><br>
        <input type="text" id="keywords" name="keywords" placeholder="Python, JavaScript, Java" required>
        <button type="submit">그래프 생성</button>
    </form>

    <!-- 결과를 표시할 iframe -->
    <h2>결과:</h2>
    <iframe id="resultFrame" name="resultFrame" style="width:100%; height:600px; border:none;">
        그래프가 여기에 표시됩니다.
    </iframe>
</body>
</html>
