<!DOCTYPE html>
<html lang="en">
<head>
 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>분석</title>
    <!-- css경로 -->
    <link rel="stylesheet" href="..\static\css\topmenu.css">
     <link rel="stylesheet" href="..\static\css\container.css"> 
     <link rel="stylesheet" href="..\static\css\sticky_note.css"> 
     <link rel="stylesheet" href="..\static\css\table.css"> 
     <link rel="stylesheet" href="..\static\css\footer.css"> 
     <link rel="stylesheet" href="..\static\css\main.css"> 
     <link rel="stylesheet" href="..\static\css\analysis-result.css"> 
    <!-- jQuery  로드  -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- SweetAlert2 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@10"></script>

    <!-- Jinja2에서 필요한 데이터를 먼저 정의 -->
    <script>
          // 서버에서 전달된 JSON 데이터를 삽입
        const techStackData = JSON.parse('{{ stack_data | tojson | safe }}');
    </script>

    <!-- 커스텀 JS 파일 로드 (jQuery 및 SweetAlert2가 먼저 로드된 후 실행되도록) -->
    <script src="..\static\js\main.js"></script>

</head>
<body>  
    <header>
        <nav class="navbar">
            <div class="topmenu-title">
                <span class="highlight">CheerUp</span>
                <span class="subtitle">AI 기반 IT 구직 분석</span>
            </div>
        </nav>
    </header>
<div>

    <main>
        <!-- 사용자가 구글 트렌드를 검색하면 나타날 화면 -->
        <div id="sticky-note"></div>
        <div class="">

            <section class="site-intro">
                <h1>IT 구직자를 위한 AI 기반 분석 사이트</h1>
                <p>이 사이트는 최신 IT 구직 정보를 분석하여, 당신에게 적합한 기술과 트렌드를 제공합니다.</p>
                <p>원하는 기술을 선택하면, 관련 기술 트렌드를 분석하여 추천해 줍니다.</p>
            </section>
            
            <section class="main-section">
                <div class="main-container">
                    <!-- Horizontal buttons for categories -->
                    <div class="category-buttons">
                        <button id="job-button" class="active">직업</button>
                        <button id="language-button">언어</button>
                        <button id="framework-button">프레임워크</button>
                        <button id="library-button">라이브러리</button>
                        <button id="tool-button">개발툴</button>
                    </div>
        
                    <!-- Search bar and result button -->
                    <div class="search-section">
                        <input type="text" id="search-bar" placeholder="검색어를 입력하세요">
                        
                        <button id="result-button">결과보기</button>
                    </div>
        
                    <!-- List of technologies based on category selection -->
                    <div class="tech-list">
                    
                    </div>
        
                    <!-- Selected technologies display with delete option -->
                    <div class="selected-tech">
                        <h3>선택된 기술들</h3>
                        <ul id="selected-tech-list">
                            <!-- Selected items will appear here -->
                        </ul>
                    </div>
        
                    <!-- Analysis result section -->
                    <div class="analysis-result"  id="analysis-result-section" style="display: none;">
                        <h2>분석결과</h2>
                        <section class="analysis-menu">
                            <button id="it_language-analysis" class="analysis-btn active" data-target="tech-results">언어</button>
                            <button id="framework-analysis" class="analysis-btn" data-target="tech-results">프레임워크</button>
                            <button id="library-analysis" class="analysis-btn" data-target="tech-results">라이브러리</button>
                            <button id="tool-analysis" class="analysis-btn" data-target="tech-results">툴</button>
                            <button id="improvement-analysis" class="analysis-btn" data-target="improvement-section">보완사항</button>
                            <button id="career-edu-lang-analysis" class="analysis-btn" data-target="common-analysis">기타 공통분석</button>
                            <button id="summary-analysis" class="analysis-btn" data-target="summary-section">총평</button>
                        </section>
                        
                        <div id="tech-results" class="analysis-content">
                            <h2 id="analysis_top5_h2">TOP5(언어)</h2>
                            <div id="report_top5_it_language" class="analysis-top5">
                                <!-- TOP5 분석 결과가 표시될 영역 -->
                            </div>
                            <div id="report_top5_framework" class="analysis-top5" style="display: none;">
                                <!-- TOP5 분석 결과가 표시될 영역 -->
                            </div>
                            <div id="report_top5_library" class="analysis-top5" style="display: none;">
                                <!-- TOP5 분석 결과가 표시될 영역 -->
                            </div>
                            <div id="report_top5_tool" class="analysis-top5" style="display: none;">
                                <!-- TOP5 분석 결과가 표시될 영역 -->
                            </div>
                            <h2 id="user_tech_h2">사용자의 기술 분석(언어)</h2>
                            <div id="result-user-tech">
                                <!-- 사용자의 기술 분석 결과가 표시될 영역 -->
                            </div>
                        </div>
                    
                        <div id="improvement-section" class="analysis-content" style="display: none;">
                            <h2>보완사항</h2>
                            <div id="report_improvement">
                                <!-- 보완사항 관련 분석 결과가 표시될 영역 -->
                            </div>
                        </div>

                        
                        <div id="common-analysis" class="analysis-content" style="display: none;">
                    
                            <h2>경력 분석 그래프</h2>
                            <div id="result-graph-career">
                                <!-- Analysis graph result will appear here -->
                            </div>
                            <br>
                            <h2>학력 분석 그래프</h2>
                            <div id="result-graph-degree">
                                <!-- Analysis graph result will appear here -->
                            </div>
                            <br>
                            <h2>어학 분석 그래프</h2>
                            <div id="result-graph-language">
                                <!-- Analysis graph result will appear here -->
                            </div>
                        </div>

                        <div id="summary-section" class="analysis-content" style="display: none;">
                            <h2>최종 분석</h2>
                            <div id="result-conclusion">
                                <!-- 최종 결론이 표시될 영역 -->
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        
                
     


    </div>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <p>&copy; 2025 CheerUp. 모든 권리 보유.</p>
            <p>문의: <a href="mailto:asiaproject257@gmail.com">asiaproject257@gmail.com</a></p>

        </div>
    </footer>
</div>



</body>
</html>
